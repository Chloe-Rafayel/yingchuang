<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="profile.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;">设置</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="card">
            <h2 style="font-size:16px;margin-bottom:14px;">账号与安全</h2>
            <a href="teacher-verify.html" style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);">
                <span>教师认证申请</span><i class="fas fa-chevron-right" style="color:var(--text-muted);"></i>
            </a>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);"><span>手机号</span><span style="color:var(--text-muted);">138****5678</span></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);"><span>修改密码</span><i class="fas fa-chevron-right" style="color:var(--text-muted);"></i></div>
        </div>
        <div class="card" style="margin-top:16px;">
            <h2 style="font-size:16px;margin-bottom:14px;">隐私与通知</h2>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);"><span>消息通知</span><input type="checkbox" checked></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;"><span>课程提醒</span><input type="checkbox" checked></div>
        </div>
        <div class="card" style="margin-top:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);"><span>清除缓存</span><button class="btn-secondary" style="padding:6px 12px;" onclick="showNotification('缓存已清除', 'success');">清除</button></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;"><span style="color:#ef4444;">退出登录</span><button class="btn-secondary" style="padding:6px 12px;" onclick="logout();">退出</button></div>
        </div>
    </main>
    <script src="js/common.js"></script>
</body>
</html>
