<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的课程 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="profile.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;">我的课程</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="card">
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:16px;">智能规划生成的学习计划或已购买的课程，可查看课程表与学习进度。</p>
            <div id="courseList"></div>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script>
        const courses = mockData.myCourses || [];
        document.getElementById('courseList').innerHTML = courses.length ? courses.map(c =>
            `<div class="card" style="margin-bottom:12px;"><div class="card-title">${c.name}</div><div class="card-subtitle">进度 ${c.progress}% · 共 ${c.total} 节 · 下次 ${c.nextDate}</div><div style="margin-top:8px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${c.progress}%;background:var(--primary);"></div></div></div>`
        ).join('') : '<div class="empty-state"><i class="fas fa-book"></i><p>暂无课程，去 <a href="profile-plan.html">智能规划</a> 生成学习计划</p></div>';
    </script>
</body>
</html>
