<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学科详情 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="subjects.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;" id="subjectName">学科</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="card" style="margin-bottom:20px;">
            <h1 style="font-size:20px;margin-bottom:8px;" id="title">数学</h1>
            <p style="color:var(--text-muted);font-size:14px;">学科介绍、课程大纲、认证教师推荐。学生可在讨论区实时上传学习心得与问题。</p>
        </div>
        <div class="card" style="margin-bottom:20px;">
            <h2 style="font-size:16px;margin-bottom:12px;">知识点列表（树形）</h2>
            <ul style="list-style:none;">
                <li style="padding:8px 0;border-bottom:1px solid var(--border);"><a href="knowledge-detail.html?id=1">勾股定理</a></li>
                <li style="padding:8px 0;border-bottom:1px solid var(--border);"><a href="knowledge-detail.html?id=5">三角函数</a></li>
                <li style="padding:8px 0;">几何证明</li>
            </ul>
        </div>
        <div class="card" style="margin-bottom:20px;">
            <h2 style="font-size:16px;margin-bottom:12px;">相关热门课程</h2>
            <div class="grid grid-2" id="relatedList"></div>
        </div>
        <div class="card">
            <h2 style="font-size:16px;margin-bottom:12px;">讨论区</h2>
            <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">可实时上传学习心得、问题照片或短视频。</p>
            <textarea class="input-field" rows="2" placeholder="发表一条讨论..."></textarea>
            <button type="button" class="btn-primary" style="margin-top:8px;" onclick="showNotification('讨论已发布', 'success');">发布</button>
            <ul style="list-style:none;margin-top:16px;">
                <li style="padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;">勾股定理在生活中的应用很实用。—— 学海启航</li>
            </ul>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script>
        const name = getUrlParam('name') || '数学';
        document.getElementById('subjectName').textContent = name;
        document.getElementById('title').textContent = name;
        const list = mockData.resources.filter(r => r.subject === name).slice(0, 4);
        document.getElementById('relatedList').innerHTML = list.map(r =>
            `<a href="resource-detail.html?id=${r.id}" class="resource-card"><img class="cover" src="${r.cover}" alt="" onerror="this.src='img/1.jpg'"><div class="info"><div class="title">${r.title}</div><div class="meta">${r.type}</div></div></a>`
        ).join('') || '<p style="color:var(--text-muted);">暂无相关课程</p>';
    </script>
</body>
</html>
