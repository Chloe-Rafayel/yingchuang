<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历提醒 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="profile.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;">日历提醒</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="card">
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:16px;">与「我的课程」联动，标记已规划的课程日期，可设置上课前提醒。</p>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:16px;">
                <span style="font-size:12px;color:var(--text-muted);">日</span><span style="font-size:12px;color:var(--text-muted);">一</span><span style="font-size:12px;color:var(--text-muted);">二</span><span style="font-size:12px;color:var(--text-muted);">三</span><span style="font-size:12px;color:var(--text-muted);">四</span><span style="font-size:12px;color:var(--text-muted);">五</span><span style="font-size:12px;color:var(--text-muted);">六</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">
                <span style="padding:8px;border-radius:8px;background:var(--bg-muted);">1</span><span style="padding:8px;">2</span><span style="padding:8px;">3</span><span style="padding:8px;">4</span><span style="padding:8px;">5</span><span style="padding:8px;">6</span><span style="padding:8px;">7</span>
                <span style="padding:8px;">8</span><span style="padding:8px;">9</span><span style="padding:8px;">10</span><span style="padding:8px;background:var(--primary);color:white;border-radius:8px;">11</span><span style="padding:8px;">12</span><span style="padding:8px;">13</span><span style="padding:8px;">14</span>
                <span style="padding:8px;background:var(--primary);color:white;border-radius:8px;">15</span><span style="padding:8px;">16</span><span style="padding:8px;">17</span><span style="padding:8px;">18</span><span style="padding:8px;">19</span><span style="padding:8px;">20</span><span style="padding:8px;">21</span>
            </div>
            <p style="margin-top:16px;font-size:13px;color:var(--text-muted);">3月15日、16日有已规划课程，可点击日期设置提醒。</p>
        </div>
    </main>
    <script src="js/common.js"></script>
</body>
</html>
