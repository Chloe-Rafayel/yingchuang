<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师认证申请 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="profile.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;">教师认证</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="card">
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:20px;">认证通过后，平台内您的用户名将显示为黄色标识，以增强权威性与可信度。</p>
            <div class="form-group">
                <label>真实姓名</label>
                <input type="text" class="input-field" placeholder="请输入真实姓名">
            </div>
            <div class="form-group">
                <label>学校</label>
                <input type="text" class="input-field" placeholder="任职学校全称">
            </div>
            <div class="form-group">
                <label>学科</label>
                <select class="select-field"><option>语文</option><option>数学</option><option>英语</option><option>物理</option><option>化学</option><option>生物</option><option>历史</option><option>地理</option><option>其他</option></select>
            </div>
            <div class="form-group">
                <label>教龄（年）</label>
                <input type="number" class="input-field" placeholder="例如：5" min="0">
            </div>
            <div class="form-group">
                <label>证明材料（图片）</label>
                <input type="file" accept="image/*" class="input-field">
            </div>
            <button type="button" class="btn-primary" style="width:100%;" onclick="showNotification('已提交，审核中。', 'success');">提交申请</button>
        </div>
    </main>
    <script src="js/common.js"></script>
</body>
</html>
