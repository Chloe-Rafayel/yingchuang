<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源上传 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="profile.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;">资源上传</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="card">
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:20px;">认证教师可上传视频、课件、图片、3D 模型、VR 全景、AR 实验包等，提交后等待审核。</p>
            <div class="form-group">
                <label>选择文件</label>
                <input type="file" class="input-field" accept="video/*,image/*,.pdf,.ppt,.pptx" multiple>
                <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">支持：视频、图片、课件、3D/VR 资源包</p>
            </div>
            <div class="form-group">
                <label>资源标题</label>
                <input type="text" class="input-field" placeholder="请输入标题">
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea class="input-field" rows="3" placeholder="简要描述资源内容"></textarea>
            </div>
            <div class="form-group">
                <label>关联学科</label>
                <select class="select-field"><option>语文</option><option>数学</option><option>英语</option><option>物理</option><option>化学</option><option>生物</option><option>历史</option><option>地理</option></select>
            </div>
            <div class="form-group">
                <label>年级</label>
                <select class="select-field"><option>初一</option><option>初二</option><option>初三</option><option>高一</option><option>高二</option><option>高三</option></select>
            </div>
            <div class="form-group">
                <label>知识点/标签</label>
                <input type="text" class="input-field" placeholder="如：实验、微课、几何证明">
            </div>
            <button type="button" class="btn-primary" style="width:100%;" onclick="showNotification('上传成功，等待审核', 'success');">提交</button>
        </div>
    </main>
    <script src="js/common.js"></script>
</body>
</html>
