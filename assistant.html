<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育智能体 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/assistant-agent.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="has-top-nav">
    <header class="header">
        <div class="header-left"><a href="home.html" class="logo"><i class="fas fa-graduation-cap"></i> 萤窗星途</a></div>
        <div class="header-center"><span style="font-weight:600;color:var(--text-muted);font-size:14px;">教育智能体</span></div>
        <div class="header-right">
            <div class="notification-icon"><i class="fas fa-bell"></i></div>
            <div class="user-menu" onclick="toggleUserMenu()"><div class="user-avatar"><i class="fas fa-user"></i></div><span class="user-name" id="userName">学海启航</span><i class="fas fa-chevron-down"></i></div>
        </div>
    </header>
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>首页</span></a>
        <a href="subjects.html" class="nav-item"><i class="fas fa-book"></i><span>学科</span></a>
        <a href="knowledge.html" class="nav-item"><i class="fas fa-lightbulb"></i><span>知识点</span></a>
        <a href="assistant.html" class="nav-item active"><i class="fas fa-robot"></i><span>智学助手</span></a>
        <a href="ar-learning.html" class="nav-item"><i class="fas fa-vr-cardboard"></i><span>AR学习</span></a>
        <a href="game.html" class="nav-item"><i class="fas fa-gamepad"></i><span>知识秘境</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>我的</span></a>
    </nav>
    <div class="user-dropdown" id="userDropdown">
        <a href="profile.html" class="dropdown-item"><i class="fas fa-user-circle"></i><span>个人中心</span></a>
        <a href="profile-settings.html" class="dropdown-item"><i class="fas fa-cog"></i><span>设置</span></a>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>退出登录</span></div>
    </div>

    <!-- 首次学段选择 -->
    <div class="agent-setup-overlay" id="setupOverlay">
        <div class="agent-setup-box">
            <h2><i class="fas fa-user-graduate" style="color:var(--primary);"></i> 选择你的学段</h2>
            <p class="sub">首次使用请选择学段。智能体将按幼儿园～高中学校课程范围为你解答，<br>问什么答什么（作文提供范文片段，不代写完整全文）。</p>
            <div class="agent-stage-grid">
                <button type="button" class="agent-stage-btn" data-stage="kindergarten">
                    <strong>幼儿园</strong><span>小班～大班</span>
                </button>
                <button type="button" class="agent-stage-btn" data-stage="primary">
                    <strong>小学</strong><span>一至六年级</span>
                </button>
                <button type="button" class="agent-stage-btn" data-stage="junior">
                    <strong>初中</strong><span>初一～初三</span>
                </button>
                <button type="button" class="agent-stage-btn" data-stage="senior">
                    <strong>高中</strong><span>高一～高三</span>
                </button>
            </div>
            <label for="setupTextbook">教材版本（可选）</label>
            <select class="select-field" id="setupTextbook">
                <option>暂不指定</option>
                <option>人教版</option>
                <option>北师大版</option>
                <option>苏教版</option>
                <option>外研版</option>
                <option>沪教版</option>
                <option>鲁教版</option>
                <option>湘教版</option>
                <option>粤教版</option>
                <option>浙教版</option>
                <option>冀教版</option>
            </select>
            <p class="agent-privacy-note">
                <i class="fas fa-shield-alt"></i>
                我们不会收集 14 岁以下用户的姓名、学校或联系方式。对话记录仅保存在本设备。
            </p>
            <button type="button" class="btn-primary" style="width:100%;" id="btnConfirmSetup">开始学习</button>
        </div>
    </div>

    <main class="main-content">
        <div class="agent-page-title">
            <h1><i class="fas fa-robot" style="color:var(--primary);"></i> 教育智能体</h1>
            <p>幼儿园～高中 · 专注课内学习 · 积极正面引导 · 作文提供范文片段</p>
            <span class="agent-badge"><i class="fas fa-check-circle"></i> 未成年人安全约束已启用</span>
        </div>

        <div class="agent-toolbar">
            <div class="agent-toolbar-left">
                <span class="tag tag-primary" id="toolbarStage">未设置学段</span>
                <span class="tag" id="toolbarTextbook">暂不指定</span>
                <button type="button" class="home-btn-sm" id="btnChangeStage"><i class="fas fa-edit"></i> 修改学段</button>
                <button type="button" class="home-btn-sm" id="btnClearChat"><i class="fas fa-trash-alt"></i> 清空对话</button>
            </div>
            <span class="agent-toolbar-meta" id="toolbarMeta">多轮记忆 · 本地保存</span>
        </div>

        <div class="card agent-chat-wrap">
            <div class="agent-chat-messages" id="chatMessages"></div>
            <div id="photoPreviewBar" style="display:none;padding:8px 20px;background:white;border-top:1px solid var(--border);align-items:center;gap:10px;">
                <img src="" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px;">
                <span class="name" style="flex:1;font-size:12px;color:var(--text-muted);"></span>
                <button type="button" class="home-btn-sm" id="btnRemovePhoto">移除</button>
            </div>
            <div class="agent-chat-input">
                <div class="agent-input-row">
                    <textarea id="chatInput" rows="1" placeholder="输入学校课程相关问题，如：初二数学勾股定理怎么用？"></textarea>
                    <div class="agent-input-actions">
                        <button type="button" class="agent-icon-btn" id="btnPhoto" title="拍照/上传题目"><i class="fas fa-camera"></i></button>
                        <button type="button" class="agent-send-btn" id="btnSend" title="发送"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
                <input type="file" id="photoInput" accept="image/*" hidden>
                <p class="agent-input-hint">问什么答什么 · 超纲内容将礼貌提示 · 支持题目拍照 OCR</p>
            </div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/config.js"></script>
    <script>
        if (!window.EDU_AGENT_CONFIG) {
            window.EDU_AGENT_CONFIG = {
                apiProvider: 'zhipu',
                apiModel: 'glm-4-flash',
                useProxy: true,
                proxyUrl: '/api/chat',
                apiKey: ''
            };
        }
    </script>
    <script src="js/knowledge-base.js"></script>
    <script src="js/curriculum-texts.js"></script>
    <script src="js/edu-agent.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="js/assistant-ui.js"></script>
    <script>
        (function () {
            const user = getCurrentUser();
            if (user && document.getElementById('userName')) {
                document.getElementById('userName').textContent = user.nickname || '学海启航';
            }
        })();
    </script>
</body>
</html>
