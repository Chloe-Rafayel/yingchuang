<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识点详情 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .exam-type-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            background: var(--bg-muted);
        }
        .exam-type-card h4 { font-size: 14px; color: var(--primary); margin-bottom: 6px; }
        .exam-type-card p { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 4px; }
        .exam-type-card .tip { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="knowledge.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;">知识点</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="card" style="margin-bottom:20px;">
            <h1 style="font-size:20px;margin-bottom:8px;" id="kpName">勾股定理</h1>
            <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
                <span class="tag tag-primary" id="kpSubject">数学</span>
                <span class="tag" id="kpGrade">初二</span>
                <span class="tag" id="kpDifficulty">难度：中</span>
            </div>
            <p style="font-size:14px;color:var(--text);line-height:1.6;" id="kpDesc">在直角三角形中，两直角边的平方和等于斜边的平方，即 a²+b²=c²。可用于求边长、证明垂直等。</p>
        </div>
        <div class="card" style="margin-bottom:20px;">
            <h2 style="font-size:16px;margin-bottom:12px;"><i class="fas fa-pencil-alt" style="color:var(--primary);margin-right:6px;"></i>常考题型（3 道）</h2>
            <div id="examTypesList"></div>
        </div>
        <div class="card" style="margin-bottom:20px;">
            <h2 style="font-size:16px;margin-bottom:12px;">关联 AR/VR 资源</h2>
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:12px;">相关 AR 实验、3D 模型入口。</p>
            <a href="resource-detail.html?id=1" class="btn-secondary">查看相关微课</a>
        </div>
        <div class="card" style="margin-bottom:20px;">
            <h2 style="font-size:16px;margin-bottom:12px;">知识图谱</h2>
            <p style="font-size:14px;color:var(--text-muted);">前置：<span id="prev">—</span> → 当前：<strong id="cur">勾股定理</strong> → 后置：<span id="next">—</span></p>
        </div>
        <div class="card">
            <h2 style="font-size:16px;margin-bottom:12px;">相关课程资源</h2>
            <div class="grid grid-2" id="relatedList"></div>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/knowledge-base.js"></script>
    <script>
        const id = getUrlParam('id') || '1';
        const kp = KnowledgeBase.getKnowledgePointById(id) || KnowledgeBase.getKnowledgePointById(1);
        document.getElementById('kpName').textContent = kp.name;
        document.getElementById('kpSubject').textContent = kp.subject;
        document.getElementById('kpGrade').textContent = kp.grade;
        document.getElementById('kpDifficulty').textContent = '难度：' + (kp.difficulty || '中');
        document.getElementById('kpDesc').textContent = kp.desc || '暂无详细描述。';
        document.getElementById('prev').textContent = (kp.prev && kp.prev[0]) || '—';
        document.getElementById('cur').textContent = kp.name;
        document.getElementById('next').textContent = (kp.next && kp.next[0]) || '—';

        document.getElementById('examTypesList').innerHTML = (kp.examTypes || []).map(function (e, i) {
            return `<div class="exam-type-card">
                <h4>题型 ${i + 1} · ${e.type}</h4>
                <p><strong>${e.title}</strong></p>
                <p>${e.stem}</p>
                <p class="tip"><i class="fas fa-lightbulb"></i> ${e.tip}</p>
            </div>`;
        }).join('');

        const relatedList = [
            { id: 1, title: '勾股定理的证明与应用', type: '微课', cover: 'img/0013.jpg' },
            { id: 2, title: '牛顿第二定律AR实验', type: 'AR实验', cover: 'img/0014.jpg' },
            { id: 3, title: '光合作用全过程', type: '视频', cover: 'img/0015.jpg' },
            { id: 4, title: '古代文明遗址VR探秘', type: 'VR全景', cover: 'img/0001.jpg' }
        ];
        document.getElementById('relatedList').innerHTML = relatedList.map(r =>
            `<a href="resource-detail.html?id=${r.id}" class="resource-card"><img class="cover" src="${r.cover}" alt="" onerror="this.src='img/0001.jpg'"><div class="info"><div class="title">${r.title}</div><div class="meta">${r.type}</div></div></a>`
        ).join('');
    </script>
</body>
</html>
