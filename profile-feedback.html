<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服反馈 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="profile.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;">客服反馈</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="card">
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:16px;">提交问题描述、上传截图，或查看历史反馈与回复状态。</p>
            <div class="form-group">
                <label>问题类型</label>
                <select class="select-field"><option>功能建议</option><option>使用问题</option><option>投诉</option><option>其他</option></select>
            </div>
            <div class="form-group">
                <label>问题描述</label>
                <textarea class="input-field" rows="4" placeholder="请详细描述您的问题或建议"></textarea>
            </div>
            <div class="form-group">
                <label>上传截图（可选）</label>
                <input type="file" accept="image/*" class="input-field">
            </div>
            <button type="button" class="btn-primary" onclick="showNotification('反馈已提交，我们会尽快处理', 'success');">提交反馈</button>
        </div>
    </main>
    <script src="js/common.js"></script>
</body>
</html>
