<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学科分类 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/course-catalog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="has-top-nav">
    <header class="header">
        <div class="header-left"><a href="home.html" class="logo"><i class="fas fa-graduation-cap"></i> 萤窗星途</a></div>
        <div class="header-center"><div class="search-box"><input type="text" placeholder="搜索课程、学科..." onfocus="location.href='assistant.html'"><i class="fas fa-search"></i></div></div>
        <div class="header-right">
            <div class="notification-icon"><i class="fas fa-bell"></i></div>
            <div class="user-menu" onclick="toggleUserMenu()"><div class="user-avatar"><i class="fas fa-user"></i></div><span class="user-name" id="userName">学海启航</span><i class="fas fa-chevron-down"></i></div>
        </div>
    </header>
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>首页</span></a>
        <a href="subjects.html" class="nav-item active"><i class="fas fa-book"></i><span>学科</span></a>
        <a href="knowledge.html" class="nav-item"><i class="fas fa-lightbulb"></i><span>知识点</span></a>
        <a href="assistant.html" class="nav-item"><i class="fas fa-robot"></i><span>智学助手</span></a>
        <a href="ar-learning.html" class="nav-item"><i class="fas fa-vr-cardboard"></i><span>AR学习</span></a>
        <a href="game.html" class="nav-item"><i class="fas fa-gamepad"></i><span>知识秘境</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>我的</span></a>
    </nav>
    <div class="user-dropdown" id="userDropdown">
        <a href="profile.html" class="dropdown-item"><i class="fas fa-user-circle"></i><span>个人中心</span></a>
        <a href="profile-settings.html" class="dropdown-item"><i class="fas fa-cog"></i><span>设置</span></a>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>退出登录</span></div>
    </div>

    <main class="main-content">
        <div class="catalog-page-title">
            <h1><i class="fas fa-layer-group"></i> 课程体系 · 按年龄学段</h1>
            <p>幼儿园以拼音识字为主；小学至高中按学科系统学习；科普课程独立分类。每个学段精选 6 门代表课程，更多课程可查看该学段全部收录。</p>
        </div>
        <nav class="catalog-nav-chips" id="catalogNav"></nav>
        <div id="catalogRoot"></div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/course-catalog.js"></script>
    <script>
        (function () {
            const user = getCurrentUser();
            if (user && document.getElementById('userName')) {
                document.getElementById('userName').textContent = user.nickname || '学海启航';
            }
        })();
        CourseCatalog.renderCatalogPage('catalogRoot');
        document.getElementById('catalogNav').innerHTML =
            CourseCatalog.STAGES.map(function (s) {
                return '<a href="#stage-' + s.id + '" class="catalog-nav-chip">' + s.label + ' ' + s.age + '</a>';
            }).join('') +
            '<a href="#stage-science" class="catalog-nav-chip">科普课程</a>';
    </script>
</body>
</html>
