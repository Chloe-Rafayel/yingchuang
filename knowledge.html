<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识点分类 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="has-top-nav">
    <header class="header">
        <div class="header-left"><a href="home.html" class="logo"><i class="fas fa-graduation-cap"></i> 萤窗星途</a></div>
        <div class="header-center"><div class="search-box"><input type="text" placeholder="搜索知识点..." onfocus="location.href='assistant.html'"><i class="fas fa-search"></i></div></div>
        <div class="header-right">
            <div class="notification-icon"><i class="fas fa-bell"></i></div>
            <div class="user-menu" onclick="toggleUserMenu()"><div class="user-avatar"><i class="fas fa-user"></i></div><span class="user-name" id="userName">学海启航</span><i class="fas fa-chevron-down"></i></div>
        </div>
    </header>
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>首页</span></a>
        <a href="subjects.html" class="nav-item"><i class="fas fa-book"></i><span>学科</span></a>
        <a href="knowledge.html" class="nav-item active"><i class="fas fa-lightbulb"></i><span>知识点</span></a>
        <a href="assistant.html" class="nav-item"><i class="fas fa-robot"></i><span>智学助手</span></a>
        <a href="ar-learning.html" class="nav-item"><i class="fas fa-vr-cardboard"></i><span>AR学习</span></a>
        <a href="game.html" class="nav-item"><i class="fas fa-gamepad"></i><span>知识秘境</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>我的</span></a>
    </nav>
    <div class="user-dropdown" id="userDropdown">
        <a href="profile.html" class="dropdown-item"><i class="fas fa-user-circle"></i><span>个人中心</span></a>
        <a href="profile-settings.html" class="dropdown-item"><i class="fas fa-cog"></i><span>设置</span></a>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>退出登录</span></div>
    </div>

    <main class="main-content">
        <div class="card" style="margin-bottom:20px;">
            <p style="color:var(--text-muted);font-size:14px;">按教材章节、知识点模块分类，系统构建知识体系。</p>
            <div style="margin-top:12px;">
                <select class="select-field" style="max-width:200px;" id="filterSubject">
                    <option value="">全部学科</option>
                    <option>数学</option><option>物理</option><option>化学</option><option>生物</option><option>历史</option><option>地理</option>
                </select>
                <select class="select-field" style="max-width:120px;margin-left:8px;" id="filterDifficulty">
                    <option value="">难度</option>
                    <option>易</option><option>中</option><option>难</option>
                </select>
            </div>
        </div>
        <div class="card">
            <h2 style="font-size:16px;margin-bottom:14px;">知识点列表</h2>
            <div class="grid grid-2" id="kpList"></div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script>
        const kps = [
            { id: 1, name: '勾股定理', subject: '数学', grade: '初二', difficulty: '中', desc: '直角三角形两直角边平方和等于斜边平方。' },
            { id: 2, name: '牛顿第二定律', subject: '物理', grade: '高一', difficulty: '中', desc: 'F=ma，力与加速度、质量的关系。' },
            { id: 3, name: '光合作用', subject: '生物', grade: '初一', difficulty: '中', desc: '绿色植物在光下合成有机物、释放氧气。' },
            { id: 4, name: '氧化还原反应', subject: '化学', grade: '高一', difficulty: '中', desc: '得失电子、化合价升降的反应。' },
            { id: 5, name: '三角函数', subject: '数学', grade: '高一', difficulty: '中', desc: '正弦、余弦、正切与单位圆。' },
            { id: 6, name: '细胞分裂', subject: '生物', grade: '高一', difficulty: '难', desc: '有丝分裂与减数分裂过程。' }
        ];
        document.getElementById('kpList').innerHTML = kps.map(k =>
            `<a href="knowledge-detail.html?id=${k.id}" class="card" style="display:block;">
                <div class="card-title">${k.name}</div>
                <div class="card-subtitle">${k.subject} · ${k.grade} · 难度${k.difficulty}</div>
                <p style="font-size:13px;color:var(--text-muted);margin-top:8px;">${k.desc}</p>
            </a>`
        ).join('');
    </script>
</body>
</html>
