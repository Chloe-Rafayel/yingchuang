<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精品课程库 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="ar-learning.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;">精品课程库</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="card" style="margin-bottom:20px;">
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:16px;">国家课程、地方特色、校本课程、素质拓展分类入口。</p>
            <div class="grid grid-2">
                <div class="card" style="text-align:center;padding:20px;"><i class="fas fa-flag" style="font-size:28px;color:var(--primary);"></i><div class="card-title" style="margin-top:8px;">国家课程</div></div>
                <div class="card" style="text-align:center;padding:20px;"><i class="fas fa-map-marker-alt" style="font-size:28px;color:var(--primary);"></i><div class="card-title" style="margin-top:8px;">地方特色</div></div>
                <div class="card" style="text-align:center;padding:20px;"><i class="fas fa-school" style="font-size:28px;color:var(--primary);"></i><div class="card-title" style="margin-top:8px;">校本课程</div></div>
                <div class="card" style="text-align:center;padding:20px;"><i class="fas fa-palette" style="font-size:28px;color:var(--primary);"></i><div class="card-title" style="margin-top:8px;">素质拓展</div></div>
            </div>
        </div>
        <div class="card">
            <h2 style="font-size:16px;margin-bottom:12px;">推荐课程</h2>
            <div class="grid grid-2" id="courseList"></div>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script>
        document.getElementById('courseList').innerHTML = mockData.resources.slice(0, 4).map(r =>
            `<a href="resource-detail.html?id=${r.id}" class="resource-card"><img class="cover" src="${r.cover}" alt="" onerror="this.src='img/1.jpg'"><div class="info"><div class="title">${r.title}</div><div class="meta">${r.subject} · ${r.type}</div></div></a>`
        ).join('');
    </script>
</body>
</html>
