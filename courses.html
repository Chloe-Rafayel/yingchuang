<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程体系 - 萤窗星途智慧教育平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/course-catalog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-left"><a href="home.html" class="logo"><i class="fas fa-arrow-left" style="font-size:18px;"></i></a></div>
        <div class="header-center"><span style="font-weight:600;">课程体系</span></div>
        <div class="header-right"></div>
    </header>
    <main class="main-content">
        <div class="catalog-page-title">
            <h1><i class="fas fa-layer-group"></i> 按年龄学段浏览课程</h1>
            <p>课程按 0～6 岁（幼儿园）、6～12 岁（小学）、13～15 岁（初中）、16～18 岁（高中）分类；科普类课程单独成类。每个学段展示 6 门代表性课程，点击「更多课程」查看该学段全部课程。</p>
        </div>
        <nav class="catalog-nav-chips" id="catalogNav"></nav>
        <div id="catalogRoot"></div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/course-catalog.js"></script>
    <script>
        CourseCatalog.renderCatalogPage('catalogRoot');
        document.getElementById('catalogNav').innerHTML =
            CourseCatalog.STAGES.map(function (s) {
                return '<a href="#stage-' + s.id + '" class="catalog-nav-chip">' + s.label + ' ' + s.age + '</a>';
            }).join('') +
            '<a href="#stage-science" class="catalog-nav-chip">科普课程</a>';
    </script>
</body>
</html>
